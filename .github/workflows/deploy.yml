name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  # 需要手动刷新收藏数据时：Actions → Deploy to GitHub Pages → Run workflow
  # 原先的 schedule（每 6 小时一次）已移除，避免 Actions 列表被定时运行堆满
  workflow_dispatch:

# 所有 JS Action 统一跑在 Node 24 上，消除 "Node.js 20 已弃用" 告警
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist  # Astro默认构建输出目录
          # v4 起默认排除 dotfiles，不加这行 .nojekyll 会被丢掉
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
